      - id: libscript-audit-version-manager
        name: LibScript Version Manager Contract Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_version_manager.cmd"
          elif git diff --no-ext-diff --cached --quiet 2>/dev/null; then
            "$ROOT_DIR/devtools/audit/audit_version_manager.sh"
          else
            _dirs=$(git diff --no-ext-diff --no-renames --cached --name-only --diff-filter=ACM | awk -F/ "\$1==\"_lib\" && \$2!=\"_common\" && NF>=3 {print \$1\"/\"\$2\"/\"\$3}" | sort -u)
            if [ -n "$_dirs" ]; then
              "$ROOT_DIR/devtools/audit/audit_version_manager.sh" $_dirs
            fi
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-schema-vars
