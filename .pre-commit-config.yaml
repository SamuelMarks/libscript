repos:
  - repo: local
    hooks:
      - id: libscript-cspell
        name: LibScript Spellcheck Audit (cspell)
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          SCRIPT_NAME="$ROOT_DIR/engine/common/parallel.sh"
          export SCRIPT_NAME
          . "$SCRIPT_NAME"
          unset SCRIPT_NAME || true
          for _d in "${LIBSCRIPT_HOME:-${HOME:-/root}/.libscript}/bin" /opt/homebrew/bin /usr/local/bin "${HOME:-/root}/.local/bin"; do
            [ -d "$_d" ] && PATH="$PATH:$_d"
          done
          export PATH
          _cs_dir=$(libscript_make_tmpdir "spell")
          _cs_tmp="${_cs_dir}/FILES.TXT"
          trap "rm -rf \"$_cs_dir\"" EXIT INT TERM
          if git diff --no-ext-diff --cached --quiet 2>/dev/null; then
            _del="${_cs_dir}/DEL.TXT"
            git ls-files --deleted > "$_del" 2>/dev/null || : > "$_del"
            git ls-files --cached --others --exclude-standard | CS_DEL="$_del" awk "BEGIN{df=ENVIRON[\"CS_DEL\"];while((getline d < df)>0)del[d]=1;close(df)} NF>0 && !(\$0 in del){print}" > "$_cs_tmp"
          else
            git diff --no-ext-diff --no-renames --cached --name-only --diff-filter=ACM | while IFS= read -r _f; do [ -f "$_f" ] && printf "%s\n" "$_f"; done > "$_cs_tmp"
          fi
          [ -s "$_cs_tmp" ] || exit 0
          if [ -x "$ROOT_DIR/node_modules/.bin/cspell" ]; then
            "$ROOT_DIR/node_modules/.bin/cspell" lint --no-progress --no-summary --no-must-find-files --file-list "$_cs_tmp" </dev/null
          elif command -v cspell >/dev/null 2>&1; then
            cspell lint --no-progress --no-summary --no-must-find-files --file-list "$_cs_tmp" </dev/null
          elif [ "${LIBSCRIPT_OFFLINE:-0}" != "1" ] && command -v npx >/dev/null 2>&1; then
            npx --yes cspell lint --no-progress --no-summary --no-must-find-files --file-list "$_cs_tmp" </dev/null
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-standards
        name: LibScript Engineering Standards Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          MODE="--staged"
          if git diff --no-ext-diff --cached --quiet 2>/dev/null; then MODE="--all"; fi
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_standards.cmd $MODE"
          else
            "$ROOT_DIR/devtools/audit/audit_standards.sh" "$MODE"
          fi'
        language: system
        pass_filenames: false
