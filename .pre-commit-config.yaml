repos:
  - repo: local
    hooks:
      - id: libscript-cspell
        name: LibScript Spellcheck Audit (cspell)
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          for _d in "${LIBSCRIPT_HOME:-${HOME:-/root}/.libscript}/bin" /opt/homebrew/bin /usr/local/bin "${HOME:-/root}/.local/bin"; do
            [ -d "$_d" ] && PATH="$PATH:$_d"
          done
          export PATH
          _cs_tmp=$(mktemp)
          trap "rm -f \"$_cs_tmp\"" EXIT INT TERM
          git ls-files --cached --others --exclude-standard | while IFS= read -r _f; do [ -f "$_f" ] && printf "%s\n" "$_f"; done > "$_cs_tmp"
          [ -s "$_cs_tmp" ] || exit 0
          if [ -x "$ROOT_DIR/node_modules/.bin/cspell" ]; then
            "$ROOT_DIR/node_modules/.bin/cspell" lint --no-progress --no-summary --no-must-find-files --file-list stdin < "$_cs_tmp"
          elif command -v cspell >/dev/null 2>&1; then
            cspell lint --no-progress --no-summary --no-must-find-files --file-list stdin < "$_cs_tmp"
          elif [ "${LIBSCRIPT_OFFLINE:-0}" != "1" ] && command -v npx >/dev/null 2>&1; then
            npx --yes cspell lint --no-progress --no-summary --no-must-find-files --file-list stdin < "$_cs_tmp"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-standards
        name: LibScript Engineering Standards Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          MODE="--staged"
          if git diff --no-ext-diff --cached --quiet 2>/dev/null; then MODE="--all"; fi
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_standards.cmd $MODE"
          else
            "$ROOT_DIR/devtools/audit/audit_standards.sh" "$MODE"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-posix
        name: LibScript POSIX & Companion Parity Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          MODE="--staged"
          if git diff --no-ext-diff --cached --quiet 2>/dev/null; then MODE="--all"; fi
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_posix.cmd $MODE"
          else
            "$ROOT_DIR/devtools/audit/audit_posix.sh" "$MODE"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-version-manager
        name: LibScript Version Manager Contract Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_version_manager.cmd"
          else
            "$ROOT_DIR/devtools/audit/audit_version_manager.sh"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-audit-schema-vars
        name: LibScript Schema Variable Coverage Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          MODE="--staged"
          if git diff --no-ext-diff --cached --quiet 2>/dev/null; then MODE="--all"; fi
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\audit_schema_vars.cmd $MODE"
          else
            "$ROOT_DIR/devtools/audit/audit_schema_vars.sh" "$MODE"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-shellcheck
        name: LibScript ShellCheck Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          for _d in "${LIBSCRIPT_HOME:-${HOME:-/root}/.libscript}/bin" /opt/homebrew/bin /usr/local/bin "${HOME:-/root}/.local/bin" "${HOME:-/root}/.cabal/bin"; do
            [ -d "$_d" ] && PATH="$PATH:$_d"
          done
          export PATH
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "if exist _lib\toolchains\shellcheck\env.cmd call _lib\toolchains\shellcheck\env.cmd >nul 2>&1 & where shellcheck >nul 2>&1 || (set LIBSCRIPT_NEVER_REFRESH_CHECKSUM_DB=1 && call libscript.cmd install shellcheck latest && call _lib\toolchains\shellcheck\env.cmd >nul 2>&1)"
            if ! command -v shellcheck >/dev/null 2>&1; then
              _win_ls_home="${LIBSCRIPT_HOME:-${USERPROFILE:-${HOME:-}}/.libscript}"
              _win_ls_home=$(printf "%s" "$_win_ls_home" | tr "\\\\" "/")
              for _sc_d in "$_win_ls_home"/shellcheck/*/bin; do
                if [ -d "$_sc_d" ]; then PATH="$_sc_d:$PATH"; export PATH; fi
              done
            fi
          else
            if [ -f "$ROOT_DIR/_lib/toolchains/shellcheck/env.sh" ]; then
              SCRIPT_NAME="$ROOT_DIR/_lib/toolchains/shellcheck/env.sh"
              export SCRIPT_NAME
              . "$ROOT_DIR/_lib/toolchains/shellcheck/env.sh" >/dev/null 2>&1 || true
              unset SCRIPT_NAME || true
            fi
            if ! command -v shellcheck >/dev/null 2>&1; then
              LIBSCRIPT_NEVER_REFRESH_CHECKSUM_DB=1 STACK="" "$ROOT_DIR/libscript.sh" install shellcheck "${SHELLCHECK_VERSION:-latest}"
              SCRIPT_NAME="$ROOT_DIR/_lib/toolchains/shellcheck/env.sh"
              export SCRIPT_NAME
              . "$ROOT_DIR/_lib/toolchains/shellcheck/env.sh" >/dev/null 2>&1 || true
              unset SCRIPT_NAME || true
            fi
          fi
          OPT_ARGS=""
          if shellcheck --list-optional 2>/dev/null | grep -q "useless-use-of-cat"; then
            OPT_ARGS="-o useless-use-of-cat"
          fi
          _sc_tmp=$(mktemp)
          trap "rm -f \"$_sc_tmp\"" EXIT INT TERM
          git ls-files --cached --others --exclude-standard "*.sh" ".githooks/pre-commit" | grep -vE "node_modules|\.git/|gen/.*" | while IFS= read -r _f; do [ -f "$_f" ] && printf "%s\n" "$_f"; done > "$_sc_tmp"
          if [ -s "$_sc_tmp" ]; then
            xargs -n 50 -P 4 shellcheck -s sh $OPT_ARGS < "$_sc_tmp"
          fi'
        language: system
        pass_filenames: false
      - id: libscript-doc-coverage
        name: LibScript 100% Documentation Coverage Audit
        entry: |
          /bin/sh -c 'ROOT_DIR=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT_DIR" || exit 1
          if [ "${OS:-}" = "Windows_NT" ]; then
            cmd.exe /c "devtools\audit\doc_coverage.cmd"
          else
            "$ROOT_DIR/devtools/audit/doc_coverage.sh"
          fi'
        language: system
        pass_filenames: false
