# ## Overview
# Configuration and definition file for release.yml.
# Builds native installers and publishes installer artifacts to GitHub Releases.
#
# ## Usage
# Triggered on Git release tags (v*), release publication events, or manually via workflow_dispatch.

name: Release Packages

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0, leave empty to auto-detect)"
        required: false
        type: string
        default: ""
      draft:
        description: "Publish as a draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Publish as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Centralized Offline Cache Hydration
  # ============================================================================
  hydrate-cache:
    name: Centralized Cache Hydration
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libscript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript
          fetch-depth: 0

      - name: Checkout CC0 Assets
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cc0-assets
          path: cc0-assets

      - name: Restore Existing Offline Cache
        uses: actions/cache/restore@v6
        id: restore-cache
        with:
          path: libscript/cache
          key:
            offline-cache-${{ runner.os }}-${{
            hashFiles('libscript/workloads/apps/openedx/offline_bundle.json',
            'libscript/synthesis/msi/hydrate_offline_cache.*') }}
          restore-keys: |
            offline-cache-${{ runner.os }}-

      - name: Hydrate Offline Artifact Cache
        shell: cmd
        run: |
          call synthesis\msi\hydrate_offline_cache.cmd --wheels --codebase

      - name: Save Hydrated Cache
        uses: actions/cache/save@v6
        if: steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: libscript/cache
          key:
            offline-cache-${{ runner.os }}-${{
            hashFiles('libscript/workloads/apps/openedx/offline_bundle.json',
            'libscript/synthesis/msi/hydrate_offline_cache.*') }}

      - name: Upload Hydrated Cache Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hydrated-offline-cache
          path: libscript/cache/
          if-no-files-found: error

  # ============================================================================
  # 2. Windows Installer (.msi) Build Matrix (Parallel)
  # ============================================================================
  build-msi:
    name: Build MSI - ${{ matrix.package.name }}
    needs: [hydrate-cache]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - id: mysql
            name: LibScript MySQL Database Server (Online)
            target_dir: _lib/databases/mysql
            build_cmd: synthesis\msi\build_component_msi.cmd --component mysql --variant online
          - id: mysql-offline
            name: LibScript MySQL Database Server (Offline)
            target_dir: _lib/databases/mysql
            build_cmd: synthesis\msi\build_component_msi.cmd --component mysql --variant offline
          - id: redis
            name: LibScript Redis Cache & Datastore (Online)
            target_dir: _lib/caches/redis
            build_cmd: synthesis\msi\build_component_msi.cmd --component redis --variant online
          - id: redis-offline
            name: LibScript Redis Cache & Datastore (Offline)
            target_dir: _lib/caches/redis
            build_cmd: synthesis\msi\build_component_msi.cmd --component redis --variant offline
          - id: mongodb
            name: LibScript MongoDB Document Database (Online)
            target_dir: _lib/databases/mongodb
            build_cmd: synthesis\msi\build_component_msi.cmd --component mongodb --variant online
          - id: mongodb-offline
            name: LibScript MongoDB Document Database (Offline)
            target_dir: _lib/databases/mongodb
            build_cmd: synthesis\msi\build_component_msi.cmd --component mongodb --variant offline
          - id: python
            name: LibScript Python Language Runtime (Online)
            target_dir: _lib/languages/python
            build_cmd: synthesis\msi\build_component_msi.cmd --component python --variant online
          - id: python-offline
            name: LibScript Python Language Runtime (Offline)
            target_dir: _lib/languages/python
            build_cmd: synthesis\msi\build_component_msi.cmd --component python --variant offline
          - id: nodejs
            name: LibScript Node.js JavaScript Runtime (Online)
            target_dir: _lib/languages/nodejs
            build_cmd: synthesis\msi\build_component_msi.cmd --component nodejs --variant online
          - id: nodejs-offline
            name: LibScript Node.js JavaScript Runtime (Offline)
            target_dir: _lib/languages/nodejs
            build_cmd: synthesis\msi\build_component_msi.cmd --component nodejs --variant offline
          - id: meilisearch
            name: LibScript Meilisearch Search Engine (Online)
            target_dir: _lib/search/meilisearch
            build_cmd:
              synthesis\msi\build_component_msi.cmd --component meilisearch --variant online
          - id: meilisearch-offline
            name: LibScript Meilisearch Search Engine (Offline)
            target_dir: _lib/search/meilisearch
            build_cmd:
              synthesis\msi\build_component_msi.cmd --component meilisearch --variant offline
          - id: caddy
            name: LibScript Caddy Web Server (Online)
            target_dir: _lib/web-servers/caddy
            build_cmd: synthesis\msi\build_component_msi.cmd --component caddy --variant online
          - id: caddy-offline
            name: LibScript Caddy Web Server (Offline)
            target_dir: _lib/web-servers/caddy
            build_cmd: synthesis\msi\build_component_msi.cmd --component caddy --variant offline
          - id: gunicorn
            name: LibScript Gunicorn WSGI Server (Online)
            target_dir: _lib/app-servers/gunicorn
            build_cmd: synthesis\msi\build_component_msi.cmd --component gunicorn --variant online
          - id: gunicorn-offline
            name: LibScript Gunicorn WSGI Server (Offline)
            target_dir: _lib/app-servers/gunicorn
            build_cmd: synthesis\msi\build_component_msi.cmd --component gunicorn --variant offline
          - id: exim
            name: LibScript Exim Mail Transfer Agent (Online)
            target_dir: _lib/utilities/exim
            build_cmd: synthesis\msi\build_component_msi.cmd --component exim --variant online
          - id: exim-offline
            name: LibScript Exim Mail Transfer Agent (Offline)
            target_dir: _lib/utilities/exim
            build_cmd: synthesis\msi\build_component_msi.cmd --component exim --variant offline
          - id: nodeenv
            name: LibScript Nodeenv Virtual Environment (Online)
            target_dir: _lib/package-managers/nodeenv
            build_cmd: synthesis\msi\build_component_msi.cmd --component nodeenv --variant online
          - id: nodeenv-offline
            name: LibScript Nodeenv Virtual Environment (Offline)
            target_dir: _lib/package-managers/nodeenv
            build_cmd: synthesis\msi\build_component_msi.cmd --component nodeenv --variant offline
          - id: openedx
            name: Open edX Platform (Online)
            target_dir: workloads/apps/openedx
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\openedx --variant online
          - id: openedx-offline
            name: Open edX Platform (Offline)
            target_dir: workloads/apps/openedx
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\openedx --variant offline
          - id: wordpress
            name: WordPress Platform (Online)
            target_dir: workloads/apps/wordpress
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\wordpress --variant online
          - id: wordpress-offline
            name: WordPress Platform (Offline)
            target_dir: workloads/apps/wordpress
            build_cmd:
              synthesis\msi\build_msi.cmd workloads\apps\wordpress --variant offline --cache-dir
              cache\wordpress
          - id: gitea
            name: Gitea Git Service (Online)
            target_dir: _lib/git-servers/gitea
            build_cmd: synthesis\msi\build_msi.cmd _lib\git-servers\gitea --variant online
          - id: gitea-offline
            name: Gitea Git Service (Offline)
            target_dir: _lib/git-servers/gitea
            build_cmd:
              synthesis\msi\build_msi.cmd _lib\git-servers\gitea --variant offline --cache-dir
              cache\gitea
          - id: drupal
            name: Drupal CMS Platform (Online)
            target_dir: workloads/apps/drupal
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\drupal --variant online
          - id: drupal-offline
            name: Drupal CMS Platform (Offline)
            target_dir: workloads/apps/drupal
            build_cmd:
              synthesis\msi\build_msi.cmd workloads\apps\drupal --variant offline --cache-dir
              cache\drupal
          - id: nextcloud
            name: Nextcloud Hub Platform (Online)
            target_dir: workloads/apps/nextcloud
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\nextcloud --variant online
          - id: nextcloud-offline
            name: Nextcloud Hub Platform (Offline)
            target_dir: workloads/apps/nextcloud
            build_cmd:
              synthesis\msi\build_msi.cmd workloads\apps\nextcloud --variant offline --cache-dir
              cache\nextcloud
          - id: odoo
            name: Odoo ERP Platform (Online)
            target_dir: workloads/apps/odoo
            build_cmd: synthesis\msi\build_msi.cmd workloads\apps\odoo --variant online
          - id: odoo-offline
            name: Odoo ERP Platform (Offline)
            target_dir: workloads/apps/odoo
            build_cmd:
              synthesis\msi\build_msi.cmd workloads\apps\odoo --variant offline --cache-dir
              cache\odoo
    defaults:
      run:
        working-directory: libscript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript
          fetch-depth: 0

      - name: Checkout CC0 Assets
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cc0-assets
          path: cc0-assets

      - name: Restore Hydrated Cache
        uses: actions/cache/restore@v6
        id: restore-cache
        with:
          path: libscript/cache
          key:
            offline-cache-${{ runner.os }}-${{
            hashFiles('libscript/workloads/apps/openedx/offline_bundle.json',
            'libscript/synthesis/msi/hydrate_offline_cache.*') }}
          restore-keys: |
            offline-cache-${{ runner.os }}-

      - name: Download Hydrated Cache (Fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: hydrated-offline-cache
          path: libscript/cache

      - name: Setup msi-rs Toolset
        shell: cmd
        run: |
          echo Installing msi-rs v0.0.1 via LibScript...
          call .\libscript.cmd install msi-rs v0.0.1
          if exist "%USERPROFILE%\.libscript\msi-rs\v0.0.1\bin\candle.exe" (
            echo Found msi-rs at %USERPROFILE%\.libscript\msi-rs\v0.0.1\bin. Adding to GITHUB_PATH.
            echo %USERPROFILE%\.libscript\msi-rs\v0.0.1\bin>>"%GITHUB_PATH%"
            exit /b 0
          )
          if exist "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe" (
            echo Found WiX v3. Adding to GITHUB_PATH.
            echo C:\Program Files (x86)\WiX Toolset v3.11\bin>>"%GITHUB_PATH%"
            exit /b 0
          )
          where candle.exe >nul 2>&1 && exit /b 0
          where wix.exe >nul 2>&1 && exit /b 0
          echo WiX Toolset compiler not found in PATH. Installing via LibScript wix component...
          call .\libscript.cmd install wix latest
          if exist "%USERPROFILE%\.libscript\wix\latest\bin\candle.exe" (
            echo %USERPROFILE%\.libscript\wix\latest\bin>>"%GITHUB_PATH%"
          ) else if exist "%USERPROFILE%\.libscript\wix\default\bin\candle.exe" (
            echo %USERPROFILE%\.libscript\wix\default\bin>>"%GITHUB_PATH%"
          )

      - name: Verify MSI Compiler
        shell: cmd
        run: |
          where candle.exe || where candle || where wix.exe || where wix || (echo [ERROR] Neither candle nor wix found in PATH & exit /b 1)

      - name: Determine Package Version and Artifact Name
        id: version
        shell: cmd
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          PKG_ID: ${{ matrix.package.id }}
          PKG_TARGET_DIR: ${{ matrix.package.target_dir }}
        run: |
          setlocal EnableDelayedExpansion
          where jq.exe >nul 2>&1
          if errorlevel 1 (
            call .\libscript.cmd install jq latest
            call .\_lib\utilities\jq\env.cmd
          )
          set "RAW_REF=!INPUT_TAG!"
          if "!RAW_REF!"=="" set "RAW_REF=!REF_NAME!"
          set "PKG_JSON_VER=22.1.0"
          set "PKG_DEF_BRANCH="
          if exist "!PKG_TARGET_DIR!\packaging.json" (
            for /f "delims=" %%V in ('jq -r ".version // empty" "!PKG_TARGET_DIR!\packaging.json" 2^>nul') do set "PKG_JSON_VER=%%V"
            for /f "delims=" %%B in ('jq -r ".source_repository.default_branch // empty" "!PKG_TARGET_DIR!\packaging.json" 2^>nul') do set "PKG_DEF_BRANCH=%%B"
          ) else if exist "workloads\apps\openedx\offline_bundle.json" (
            set "COMP_ID=!PKG_ID:-offline=!"
            for /f "delims=" %%V in ('jq -r --arg c "!COMP_ID!" ".databases[$c].version // .runtimes[$c].version // .webservers[$c].version // empty" "workloads\apps\openedx\offline_bundle.json" 2^>nul') do set "PKG_JSON_VER=%%V"
          )
          if /i "!PKG_JSON_VER:~0,1!"=="v" set "PKG_JSON_VER=!PKG_JSON_VER:~1!"
          set "TARGET_REF="
          if not "!INPUT_TAG!"=="" (
            echo "!INPUT_TAG!" | findstr /I /C:"!PKG_ID!" /C:"open-release/" /C:"release/" /C:"verawood" >nul 2>&1
            if not errorlevel 1 set "TARGET_REF=!INPUT_TAG!"
            if "!PKG_DEF_BRANCH!"=="" set "TARGET_REF=!INPUT_TAG!"
          )
          if "!TARGET_REF!"=="" (
            if not "!PKG_DEF_BRANCH!"=="" (
              set "TARGET_REF=!PKG_DEF_BRANCH!"
            ) else if not "!PKG_JSON_VER!"=="" (
              set "TARGET_REF=!PKG_JSON_VER!"
            ) else (
              set "TARGET_REF=!RAW_REF!"
            )
          )
          for /f "tokens=1,2,3 delims=	" %%A in ('jq -rn --arg tr "!TARGET_REF!" --arg pv "!PKG_JSON_VER!" --arg pid "!PKG_ID!" "def clean($s): ($s | sub(\"^(refs/(heads|tags)/)?(open-release/|release/)?\"; \"\") | sub(\"^v(?=[0-9])\"; \"\") | sub(\"\\\\.master$\"; \"\") | gsub(\"[^a-zA-Z0-9._-]\"; \"-\")); def wix($c; $t; $p): ({\"aspen\":1,\"birch\":2,\"cypress\":3,\"dogwood\":4,\"eucalyptus\":5,\"ficus\":6,\"ginkgo\":7,\"hawthorn\":8,\"ironwood\":9,\"juniper\":10,\"koa\":11,\"lilac\":12,\"maple\":13,\"nutmeg\":14,\"olive\":15,\"palm\":16,\"quince\":17,\"redwood\":18,\"sumac\":19,\"teak\":20,\"ulmo\":21,\"verawood\":22,\"williamsii\":23}) as $m | ($c | capture(\"^(?<n>[a-zA-Z]+)(\\\\.(?<pt>[0-9]+))?\") // null) as $cap | if ($cap != null and ($m[$cap.n | ascii_downcase] != null)) then \"\($m[$cap.n | ascii_downcase]).\($cap.pt // \"0\").0.0\" else (($t | capture(\"(?<v>[0-9]+(\\\\.[0-9]+)+)\").v? // ($p | capture(\"(?<v>[0-9]+(\\\\.[0-9]+)+)\").v?) // \"22.1.0\") | split(\".\") | (. + [\"0\",\"0\",\"0\"])[0:4] | join(\".\")) end; (clean($tr)) as $cv | (wix($cv; $tr; $pv)) as $wv | (if ($pid | endswith(\"-offline\")) then \"\(($pid | sub(\"-offline$\"; \"\")))-\($cv)-x64-offline\" else \"\($pid)-\($cv)-x64-online\" end) as $on | \"\($wv)\t\($cv)\t\($on)\""') do (
            set "WIX_VER=%%A"
            set "CLEAN_VER=%%B"
            set "OUT_NAME=%%C"
          )
          echo Package: !PKG_ID!
          echo Target Ref: !TARGET_REF!
          echo Clean Version: !CLEAN_VER!
          echo WiX Product Version: !WIX_VER!
          echo Artifact Base Name: !OUT_NAME!
          echo version=!WIX_VER!>>"%GITHUB_OUTPUT%"
          echo clean_version=!CLEAN_VER!>>"%GITHUB_OUTPUT%"
          echo target_ref=!TARGET_REF!>>"%GITHUB_OUTPUT%"
          echo out_name=!OUT_NAME!>>"%GITHUB_OUTPUT%"

      - name: Build MSI Package (${{ matrix.package.name }})
        shell: cmd
        run: |
          call ${{ matrix.package.build_cmd }} --out ${{ steps.version.outputs.out_name }} --version ${{ steps.version.outputs.version }} --branch ${{ steps.version.outputs.target_ref }}
          if not exist "${{ steps.version.outputs.out_name }}.msi" (
            echo [ERROR] Expected MSI artifact was not generated: ${{ steps.version.outputs.out_name }}.msi >&2
            exit /b 1
          )

      - name: Verify and Prepare Artifacts
        shell: cmd
        run: |
          call devtools\ci\prepare_artifacts.cmd ${{ steps.version.outputs.out_name }}.msi

      - name: Upload MSI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-msi-${{ matrix.package.id }}
          path: |
            libscript/${{ steps.version.outputs.out_name }}.msi
            libscript/${{ steps.version.outputs.out_name }}.msi.sha256
          if-no-files-found: error

  # ============================================================================
  # 3. Future Format Builders (Scaffolded for 160+ Packages)
  # ============================================================================
  # Each format job below builds <package_id>-<version>.<ext> and uploads
  # artifacts via actions/upload-artifact@v4, which publish-release attaches to
  # the GitHub Release.
  #
  # build-exe:
  #   name: Build EXE - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: windows-latest
  #   ...
  #
  # build-dmg:
  #   name: Build DMG - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: macos-latest
  #   ...
  #
  # build-pkg:
  #   name: Build PKG - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: macos-latest
  #   ...
  #
  # build-rpm:
  #   name: Build RPM - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-deb:
  #   name: Build DEB - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-apk:
  #   name: Build APK - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-txz:
  #   name: Build TXZ - ${{ matrix.package.name }}
  #   needs: [hydrate-cache]
  #   runs-on: ubuntu-latest
  #   ...

  # ============================================================================
  # 4. Publish Release Assets to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release Assets
    needs: [build-msi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Display Release Assets
        shell: sh
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lah dist/

      - name: Generate Consolidated SHA256SUMS
        shell: sh
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          for f in *.*; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            if [ -f "$f" ] && [ -s "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt || true

      - name: Resolve Release Tag & Title
        id: release_info
        shell: sh
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Publish Assets to GitHub Release
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          IS_DRAFT: ${{ github.event.inputs.draft || false }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease || false }}
        run: |
          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          ./devtools/ci/publish_release.sh --tag "$TAG" --dist-dir dist $DRAFT_FLAG $PRERELEASE_FLAG
