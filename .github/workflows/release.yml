# ## Overview
# Configuration and definition file for release.yml.
# Builds native installers and publishes installer artifacts to GitHub Releases.
#
# ## Usage
# Triggered on Git release tags (v*), release publication events, or manually via workflow_dispatch.

name: Release Packages

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0, leave empty to auto-detect)"
        required: false
        type: string
        default: ""
      draft:
        description: "Publish as a draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Publish as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Windows Installer (.msi) Build Matrix
  # ============================================================================
  build-msi:
    name: Build MSI - ${{ matrix.package.name }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - id: mysql
            name: LibScript MySQL Database Server
            target_dir: _lib/databases/mysql
            build_cmd: packaging\build_component_msi.cmd --component mysql
          - id: redis
            name: LibScript Redis Cache & Datastore
            target_dir: _lib/caches/redis
            build_cmd: packaging\build_component_msi.cmd --component redis
          - id: mongodb
            name: LibScript MongoDB Document Database
            target_dir: _lib/databases/mongodb
            build_cmd: packaging\build_component_msi.cmd --component mongodb
          - id: python
            name: LibScript Python Language Runtime
            target_dir: _lib/languages/python
            build_cmd: packaging\build_component_msi.cmd --component python
          - id: nodejs
            name: LibScript Node.js JavaScript Runtime
            target_dir: _lib/languages/nodejs
            build_cmd: packaging\build_component_msi.cmd --component nodejs
          - id: meilisearch
            name: LibScript Meilisearch Search Engine
            target_dir: _lib/search/meilisearch
            build_cmd: packaging\build_component_msi.cmd --component meilisearch
          - id: openedx-core
            name: Open edX Platform Core
            target_dir: stacks/cms/openedx
            build_cmd: packaging\build_openedx_core_msi.cmd
          - id: openedx
            name: Open edX Platform (Master Online)
            target_dir: stacks/cms/openedx
            build_cmd: packaging\build_openedx_orchestrator_msi.cmd --variant online
          - id: openedx-offline
            name: Open edX Platform (Master Offline)
            target_dir: stacks/cms/openedx
            build_cmd: packaging\build_openedx_orchestrator_msi.cmd --variant offline

    steps:
      - name: Clone CC0 Assets
        shell: pwsh
        run: |
          if (-not (Test-Path "../cc0-assets")) {
            git clone --depth 1 https://github.com/SamuelMarks/cc0-assets.git ../cc0-assets
          }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          $wixV3 = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path "$wixV3\candle.exe") {
            Write-Host "Found WiX v3 at $wixV3. Adding to GITHUB_PATH."
            Add-Content -Path $env:GITHUB_PATH -Value $wixV3
          } elseif (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "candle.exe is already available in PATH."
          } elseif (Get-Command wix.exe -ErrorAction SilentlyContinue) {
            Write-Host "wix.exe is already available in PATH."
          } else {
            Write-Host "WiX Toolset compiler not found in PATH. Installing via Chocolatey..."
            choco install wixtoolset -y --no-progress
            if (Test-Path "$wixV3\candle.exe") {
              Add-Content -Path $env:GITHUB_PATH -Value $wixV3
            }
          }

      - name: Verify WiX Compiler
        shell: cmd
        run: |
          where candle.exe || where wix.exe || (echo [ERROR] Neither candle.exe nor wix.exe found in PATH & exit /b 1)

      - name: Determine Package Version and Artifact Name
        id: version
        shell: pwsh
        run: |
          # 1. Resolve raw tag/branch from GitHub context
          $rawRef = ""
          if ("${{ github.event.inputs.tag_name }}") {
            $rawRef = "${{ github.event.inputs.tag_name }}".Trim()
          } elseif ("${{ github.ref_name }}") {
            $rawRef = "${{ github.ref_name }}".Trim()
          }

          # 2. Extract package metadata if packaging.json exists
          $pkgJsonVer = "22.1.0"
          $pkgDefaultBranch = ""
          if (Test-Path "${{ matrix.package.target_dir }}\packaging.json") {
            $json = Get-Content "${{ matrix.package.target_dir }}\packaging.json" | ConvertFrom-Json
            if ($json.version) { $pkgJsonVer = "$($json.version)".TrimStart("v").Trim() }
            if ($json.source_repository -and $json.source_repository.default_branch) {
              $pkgDefaultBranch = "$($json.source_repository.default_branch)".Trim()
            }
          }

          # 3. Determine target ref for naming (use tag/branch, or package default_branch, or manifest version)
          # Note: The libscript repository tag (e.g. v0.0.1) is NOT the software version of the third-party stack.
          $targetRef = ""
          if ("${{ github.event.inputs.tag_name }}") {
            $inputTag = "${{ github.event.inputs.tag_name }}".Trim()
            if ($inputTag -match "${{ matrix.package.id }}" -or $inputTag -match "(open-release|release)/" -or $inputTag -match "verawood" -or -not $pkgDefaultBranch) {
              $targetRef = $inputTag
            }
          }
          if (-not $targetRef) {
            if ($pkgDefaultBranch) {
              $targetRef = $pkgDefaultBranch
            } elseif ($pkgJsonVer) {
              $targetRef = $pkgJsonVer
            } else {
              $targetRef = $rawRef
            }
          }

          # 4. Sanitize version string for filename:
          # Strips generic prefixes: 'open-release/', 'release/', 'refs/heads/', 'refs/tags/', 'v'
          $cleanVer = $targetRef -replace '^(refs/(heads|tags)/)?(open-release/|release/)?', ''
          $cleanVer = $cleanVer -replace '^v(?=\d)', ''
          # Simplify '<name>.master' release branches to '<name>' (e.g. quince.master -> quince, verawood.master -> verawood)
          if ($cleanVer -match '^([a-zA-Z0-9_-]+)\.master$') {
            $cleanVer = $Matches[1]
          }
          $cleanVer = $cleanVer -replace '[^a-zA-Z0-9._-]', '-'

          # 5. Determine numeric WiX Product Version (Major.Minor.Build.Revision)
          # WiX requires 3 or 4 decimal integers (0-255 for major/minor, 0-65535 for build/revision)
          $namedReleases = @{
            "aspen" = 1; "birch" = 2; "cypress" = 3; "dogwood" = 4;
            "eucalyptus" = 5; "ficus" = 6; "ginkgo" = 7; "hawthorn" = 8;
            "ironwood" = 9; "juniper" = 10; "koa" = 11; "lilac" = 12;
            "maple" = 13; "nutmeg" = 14; "olive" = 15; "palm" = 16;
            "quince" = 17; "redwood" = 18; "sumac" = 19; "teak" = 20;
            "ulmo" = 21; "verawood" = 22; "williamsii" = 23
          }

          $wixVer = ""
          if ($cleanVer -match '^([a-zA-Z]+)(?:\.(\d+))?') {
            $relName = $Matches[1].ToLower()
            $pointVer = if ($Matches[2]) { [int]$Matches[2] } else { 0 }
            if ($namedReleases.ContainsKey($relName)) {
              $majorVer = $namedReleases[$relName]
              $wixVer = "$majorVer.$pointVer.0.0"
            }
          }

          if (-not $wixVer) {
            $numericCandidate = ""
            if ($targetRef -match '(\d+(?:\.\d+)+)') {
              $numericCandidate = $Matches[1]
            } elseif ($pkgJsonVer -match '(\d+(?:\.\d+)+)') {
              $numericCandidate = $Matches[1]
            } else {
              $numericCandidate = "22.1.0"
            }
            $parts = $numericCandidate.Split('.')
            while ($parts.Length -lt 3) { $parts += "0" }
            $wixVer = ($parts[0..([Math]::Min($parts.Length - 1, 3))]) -join '.'
          }

          # 6. Canonical package filename: <package_id>-<version>
          $pkgId = "${{ matrix.package.id }}"
          $outName = "$pkgId-$cleanVer"

          Write-Host "Package: $pkgId"
          Write-Host "Target Ref: $targetRef"
          Write-Host "Clean Version: $cleanVer"
          Write-Host "WiX Product Version: $wixVer"
          Write-Host "Artifact Base Name: $outName"

          "version=$wixVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "clean_version=$cleanVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target_ref=$targetRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "out_name=$outName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI Package (${{ matrix.package.name }})
        shell: cmd
        run: |
          call ${{ matrix.package.build_cmd }} --out ${{ steps.version.outputs.out_name }} --version ${{ steps.version.outputs.version }} --branch ${{ steps.version.outputs.target_ref }}
          if not exist "${{ steps.version.outputs.out_name }}.msi" (
            echo [ERROR] Expected MSI artifact was not generated: ${{ steps.version.outputs.out_name }}.msi >&2
            exit /b 1
          )

      - name: Verify and Prepare Artifacts
        shell: cmd
        run: |
          call devtools\ci\prepare_artifacts.cmd ${{ steps.version.outputs.out_name }}.msi

      - name: Upload MSI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-msi-${{ matrix.package.id }}
          path: |
            ${{ steps.version.outputs.out_name }}.msi
            ${{ steps.version.outputs.out_name }}.msi.sha256
          if-no-files-found: error

  # ============================================================================
  # 2. Future Format Builders (Scaffolded for 160+ Packages)
  # ============================================================================
  # Each format job below builds <package_id>-<version>.<ext> and uploads
  # artifacts via actions/upload-artifact@v4, which publish-release attaches to
  # the GitHub Release.
  #
  # build-exe:
  #   name: Build EXE - ${{ matrix.package.name }}
  #   runs-on: windows-latest
  #   ...
  #
  # build-dmg:
  #   name: Build DMG - ${{ matrix.package.name }}
  #   runs-on: macos-latest
  #   ...
  #
  # build-pkg:
  #   name: Build PKG - ${{ matrix.package.name }}
  #   runs-on: macos-latest
  #   ...
  #
  # build-rpm:
  #   name: Build RPM - ${{ matrix.package.name }}
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-deb:
  #   name: Build DEB - ${{ matrix.package.name }}
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-apk:
  #   name: Build APK - ${{ matrix.package.name }}
  #   runs-on: ubuntu-latest
  #   ...
  #
  # build-txz:
  #   name: Build TXZ - ${{ matrix.package.name }}
  #   runs-on: ubuntu-latest
  #   ...

  # ============================================================================
  # 3. Publish Release Assets to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release Assets
    needs: [build-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Display Release Assets
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lah dist/

      - name: Generate Consolidated SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          for f in *.*; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            if [ -f "$f" ] && [ -s "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt || true

      - name: Resolve Release Tag & Title
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          IS_DRAFT: ${{ github.event.inputs.draft || false }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease || false }}
        run: |
          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          ./devtools/ci/publish_release.sh --tag "$TAG" --dist-dir dist $DRAFT_FLAG $PRERELEASE_FLAG
