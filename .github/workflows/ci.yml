name: CI Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  precommit:
    name: Pre-commit checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (for Prettier and cspell)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Pre-commit Dance (Unix)
        if: runner.os != 'Windows'
        run: ./devtools/ci/precommit_dance.sh

      - name: Run Pre-commit Dance (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call devtools\ci\precommit_dance.cmd
