# ## Overview
# Configuration and definition file for ci.yml.
#
# ## Usage
# Processed automatically during build or runtime.

name: CI Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  precommit:
    name: Pre-commit checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: libscript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript

      - name: Checkout CC0 Assets
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cc0-assets
          path: cc0-assets

      - name: Setup Node (for Prettier and cspell)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run Pre-commit Dance (Unix)
        if: runner.os != 'Windows'
        run: ./devtools/ci/precommit_dance.sh

      - name: Run Pre-commit Dance (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call devtools\ci\precommit_dance.cmd
