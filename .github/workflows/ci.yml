# ## Overview
# Configuration and definition file for ci.yml.
#
# ## Usage
# Processed automatically during build or runtime.

name: CI Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  precommit:
    name: Pre-commit checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: libscript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript

      - name: Checkout CC0 Assets
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cc0-assets
          path: cc0-assets

      - name: Restore Bootstrapped Toolchain Download Cache
        uses: actions/cache/restore@v6
        id: restore-dl-cache
        with:
          path: libscript/cache/downloads
          key: ci-downloads-${{ runner.os }}-${{ hashFiles('libscript/_lib/checksums.txt') }}
          restore-keys: |
            ci-downloads-${{ runner.os }}-

      - name: Setup Node (for Prettier and cspell)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run Pre-commit Dance (Unix)
        if: runner.os != 'Windows'
        shell: sh
        run: ./devtools/ci/precommit_dance.sh

      - name: Run Pre-commit Dance (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call devtools\ci\precommit_dance.cmd

      - name: Save Bootstrapped Toolchain Download Cache
        uses: actions/cache/save@v6
        if: steps.restore-dl-cache.outputs.cache-hit != 'true'
        with:
          path: libscript/cache/downloads
          key: ci-downloads-${{ runner.os }}-${{ hashFiles('libscript/_lib/checksums.txt') }}

  windows-zero-powershell:
    name: Zero-PowerShell Windows .cmd Suite
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: libscript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript

      - name: Run Windows .cmd Suite with PowerShell Removed from PATH
        shell: cmd
        run: call tests\run_zero_powershell_suite.cmd

  msdos-qemu-smoke:
    name: Headless QEMU FreeDOS / MS-DOS 4.0 DOS32A Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: libscript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: libscript

      - name: Install QEMU x86 System Emulator
        shell: sh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 zip

      - name: Run Headless QEMU MS-DOS DOS32A Smoke Suite
        shell: sh
        run: ./tests/test_qemu_msdos_smoke.sh && ./tests/run_zero_powershell_suite.sh
