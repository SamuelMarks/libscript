name: CI Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Markdown Generator
        run: ./devtools/docs-gen/generate_markdown_docs.sh

      - name: Verify Documentation Freshness
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Documentation is out of date! Please run devtools/docs-gen/generate_markdown_docs.sh and commit the results."
            git diff
            exit 1
          fi

  test:
    name: ${{ matrix.component }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      LIBSCRIPT_WINDOWS_PKG_MGR: "choco"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        component:
